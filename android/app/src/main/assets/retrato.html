<!doctype html>
<html>
<head><meta charset="utf-8"></head>
<body>
<!-- Copias de oficina/ui/pixel/ (las pone el build: tarea copiarPixel de app/build.gradle.kts). -->
<script src="pixel/personajes.js"></script>
<script src="pixel/avatar.js"></script>
<script>
  function pintar(avJson, semilla, tam) {
    try {
      var av = JSON.parse(avJson || '{}');
      var color = App.Pixel.spec(av, semilla).top.c;
      App.Pixel.retrato(av, semilla, tam).then(function (u) { Puente.listo(u, color); }, function () { Puente.fallo(); });
    } catch (e) { Puente.fallo(); }
  }
</script>
</body>
</html>
