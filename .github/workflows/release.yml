# Build automático de los instaladores (Mac, Windows y el APK de Android).
#
# - Al subir una etiqueta vX.Y.Z: corre los tests, arma el .dmg (Mac), el instalador .exe (Windows) y el APK de Android y los adjunta
#   a la release de esa etiqueta.
#   Si la release ya existe (notas escritas a mano), solo sube o reemplaza el instalador, sin tocar las notas.
#   Si no existe, la crea como borrador con las notas de docs/releases/vX.Y.Z.md (o un texto para completar a mano) y
#   queda para revisarla y publicarla.
# - A mano (Actions → Release → Run workflow): arma los instaladores y los deja como artefactos del run. Si se le pone
#   una etiqueta (v1.14.0), además crea la release en borrador sobre ese commit, como si se hubiera subido la etiqueta;
#   la etiqueta la crea GitHub al publicar la release.
#
# Las dos plataformas salen de la carcasa Electron (desktop/) con el backend TypeScript (backend/).
# La versión sale de desktop/package.json.
#
# Actualizaciones automáticas: cada release lleva lo que leen las apps instaladas.
# - Mac: Oficina-X-arm64.zip firmado con la clave EdDSA (secret SPARKLE_PRIVATE_KEY) y appcast.xml. Lo leen el
#   actualizador propio de la app Electron (desktop/src/actualizaciones-mac.ts) y Sparkle en la 1.0 Swift, que así
#   pasa sola a la app Electron.
# - Windows (electron-updater): latest.yml y el .blockmap junto al .exe.
# Las apps solo ven releases publicadas (no borradores): publicar la release es lo que la manda a todos.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      etiqueta:
        description: "Etiqueta de la release (ej. v1.14.0). Vacío: solo arma los instaladores como artefactos. Con etiqueta: crea la release en borrador sobre este commit y la etiqueta se crea al publicarla."
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  # descargas de Electron y de las herramientas de electron-builder (NSIS, 7zip): van a la caché
  ELECTRON_CACHE: ${{ github.workspace }}/.cache/electron
  ELECTRON_BUILDER_CACHE: ${{ github.workspace }}/.cache/electron-builder
  # sign_update: firma EdDSA del .zip de Mac (la misma herramienta y formato que usaba la app Swift)
  SPARKLE_VERSION: "2.10.1"

jobs:
  mac:
    name: macOS (arm64)
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Versión
        id: version
        env:
          ETIQUETA: ${{ inputs.etiqueta || (github.ref_type == 'tag' && github.ref_name || '') }}
        run: |
          VERSION="$(node -p "require('./desktop/package.json').version")"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if [ -n "$ETIQUETA" ] && [ "$ETIQUETA" != "v$VERSION" ]; then
            echo "::error::La etiqueta $ETIQUETA no coincide con la versión de desktop/package.json ($VERSION)."
            exit 1
          fi
          # CFBundleVersion entero y creciente (1.2.3 -> 10203): Sparkle en la 1.0 Swift (build 10) lo compara con el suyo
          BUILD="$(node -p "const [a,b,c]=require('./desktop/package.json').version.split('-')[0].split('.').map(Number); a*10000+b*100+c")"
          echo "build=$BUILD" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            desktop/package-lock.json

      - name: Caché de Electron
        uses: actions/cache@v4
        with:
          path: .cache
          key: electron-${{ runner.os }}-${{ hashFiles('desktop/package-lock.json') }}
          restore-keys: electron-${{ runner.os }}-

      - name: Dependencias
        run: |
          npm ci --prefix backend
          npm ci --prefix desktop

      - name: Tipos
        run: |
          (cd backend && npx tsc --noEmit)
          (cd desktop && npx tsc -p .)

      # Localmente los corre el hook .githooks/pre-push; acá, en Mac, antes de publicar.
      - name: Tests del backend
        working-directory: backend
        run: npx vitest run

      - name: Compilar y empaquetar
        working-directory: desktop
        run: |
          node scripts/build.mjs --recursos
          npx electron-builder --mac --arm64 --publish never -c.buildVersion=${{ steps.version.outputs.build }}

      - name: Instalador
        id: dmg
        run: |
          NAME="Oficina-${{ steps.version.outputs.version }}-arm64.dmg"
          [ -f "desktop/release/$NAME" ] || { echo "::error::No se generó desktop/release/$NAME"; exit 1; }
          codesign --verify --deep --strict desktop/release/mac-arm64/Oficina.app
          SHA="$(shasum -a 256 "desktop/release/$NAME" | cut -d' ' -f1)"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          { echo "### $NAME"; echo; echo "SHA-256: \`$SHA\`"; } >> "$GITHUB_STEP_SUMMARY"

      # El actualizador baja el .zip (no el .dmg) y lo verifica con la firma EdDSA que va en appcast.xml.
      - name: Paquete de actualización
        id: zip
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
          VERSION: ${{ steps.version.outputs.version }}
          BUILD: ${{ steps.version.outputs.build }}
          TAG: ${{ inputs.etiqueta || github.ref_name }}
          REPO: ${{ github.repository }}
          ETIQUETA: ${{ inputs.etiqueta || (github.ref_type == 'tag' && github.ref_name || '') }}
        run: |
          if [ -z "$SPARKLE_PRIVATE_KEY" ]; then
            if [ -n "$ETIQUETA" ]; then
              echo "::error::Falta el secret SPARKLE_PRIVATE_KEY: sin él la release no le llega a las Mac por actualización automática."
              exit 1
            fi
            echo "::warning::Sin SPARKLE_PRIVATE_KEY: no se arma el paquete de actualización."
            echo "listo=0" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          ZIP="Oficina-$VERSION-arm64.zip"
          (cd desktop/release/mac-arm64 && ditto -c -k --sequesterRsrc --keepParent Oficina.app "../$ZIP")
          curl -fsSL -o "$RUNNER_TEMP/sparkle.tar.xz" \
            "https://github.com/sparkle-project/Sparkle/releases/download/$SPARKLE_VERSION/Sparkle-$SPARKLE_VERSION.tar.xz"
          mkdir -p "$RUNNER_TEMP/sparkle" && tar -xf "$RUNNER_TEMP/sparkle.tar.xz" -C "$RUNNER_TEMP/sparkle"
          KEY="$RUNNER_TEMP/sparkle.key"
          printf '%s' "$SPARKLE_PRIVATE_KEY" > "$KEY"
          FIRMA="$("$RUNNER_TEMP/sparkle/bin/sign_update" --ed-key-file "$KEY" "desktop/release/$ZIP")"
          rm -f "$KEY"
          [ -n "$FIRMA" ] || { echo "::error::sign_update no devolvió la firma."; exit 1; }
          FECHA="$(LC_ALL=C date -u '+%a, %d %b %Y %H:%M:%S +0000')"
          cat > desktop/release/appcast.xml <<EOF
          <?xml version="1.0" encoding="utf-8"?>
          <rss version="2.0" xmlns:sparkle="http://www.andymatuschak.org/xml-namespaces/sparkle">
            <channel>
              <title>Oficina</title>
              <item>
                <title>Oficina $VERSION</title>
                <pubDate>$FECHA</pubDate>
                <sparkle:version>$BUILD</sparkle:version>
                <sparkle:shortVersionString>$VERSION</sparkle:shortVersionString>
                <sparkle:minimumSystemVersion>13.0</sparkle:minimumSystemVersion>
                <sparkle:fullReleaseNotesLink>https://github.com/$REPO/releases/tag/$TAG</sparkle:fullReleaseNotesLink>
                <enclosure url="https://github.com/$REPO/releases/download/$TAG/$ZIP" type="application/octet-stream" $FIRMA/>
              </item>
            </channel>
          </rss>
          EOF
          xmllint --noout desktop/release/appcast.xml
          echo "zip=$ZIP" >> "$GITHUB_OUTPUT"
          echo "listo=1" >> "$GITHUB_OUTPUT"

      - name: Guardar como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.dmg.outputs.name }}
          path: |
            desktop/release/${{ steps.dmg.outputs.name }}
            desktop/release/Oficina-*-arm64.zip
            desktop/release/appcast.xml
          retention-days: 14

      - name: Adjuntar a la release
        if: github.ref_type == 'tag' || inputs.etiqueta != ''
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.etiqueta || github.ref_name }}
          MANUAL: ${{ inputs.etiqueta }}
          VERSION: ${{ steps.version.outputs.version }}
          FILE: desktop/release/${{ steps.dmg.outputs.name }}
          ZIP: desktop/release/${{ steps.zip.outputs.zip }}
        run: |
          # el job de Windows corre en paralelo: si el otro ya creó la release, solo se suben los archivos
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            # las notas salen de docs/releases/<etiqueta>.md si existe; si no, un texto para completar a mano
            NOTAS="docs/releases/$TAG.md"
            if [ -f "$NOTAS" ]; then
              gh release create "$TAG" --draft --target "$GITHUB_SHA" --title "Oficina $VERSION" --notes-file "$NOTAS" || true
            else
              gh release create "$TAG" --draft --target "$GITHUB_SHA" --title "Oficina $VERSION" \
                --notes "Borrador generado por el build automático. Completar las notas antes de publicar." || true
            fi
          elif [ -n "$MANUAL" ]; then
            # relanzada a mano sobre un borrador que ya existía: que apunte a este commit (la etiqueta se crea al publicar)
            gh release edit "$TAG" --target "$GITHUB_SHA" || true
          fi
          gh release upload "$TAG" "$FILE" "$ZIP" desktop/release/appcast.xml --clobber

  windows:
    name: Windows (x64)
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Versión
        id: version
        env:
          ETIQUETA: ${{ inputs.etiqueta || (github.ref_type == 'tag' && github.ref_name || '') }}
        run: |
          VERSION="$(node -p "require('./desktop/package.json').version")"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if [ -n "$ETIQUETA" ] && [ "$ETIQUETA" != "v$VERSION" ]; then
            echo "::error::La etiqueta $ETIQUETA no coincide con la versión de desktop/package.json ($VERSION)."
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            desktop/package-lock.json

      - name: Caché de Electron
        uses: actions/cache@v4
        with:
          path: .cache
          key: electron-${{ runner.os }}-${{ hashFiles('desktop/package-lock.json') }}
          restore-keys: electron-${{ runner.os }}-

      - name: Dependencias
        run: |
          npm ci --prefix backend
          npm ci --prefix desktop

      - name: Tipos
        run: |
          (cd backend && npx tsc --noEmit)
          (cd desktop && npx tsc -p .)

      - name: Compilar y empaquetar
        working-directory: desktop
        run: |
          node scripts/build.mjs --recursos
          npx electron-builder --win --x64 --publish never

      - name: Instalador
        id: exe
        run: |
          NAME="Oficina-Setup-${{ steps.version.outputs.version }}.exe"
          for f in "$NAME" "$NAME.blockmap" latest.yml; do
            [ -f "desktop/release/$f" ] || { echo "::error::No se generó desktop/release/$f"; exit 1; }
          done
          SHA="$(sha256sum "desktop/release/$NAME" | cut -d' ' -f1)"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          { echo "### $NAME"; echo; echo "SHA-256: \`$SHA\`"; } >> "$GITHUB_STEP_SUMMARY"

      - name: Guardar como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.exe.outputs.name }}
          path: |
            desktop/release/${{ steps.exe.outputs.name }}
            desktop/release/${{ steps.exe.outputs.name }}.blockmap
            desktop/release/latest.yml
          retention-days: 14

      - name: Adjuntar a la release
        if: github.ref_type == 'tag' || inputs.etiqueta != ''
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.etiqueta || github.ref_name }}
          MANUAL: ${{ inputs.etiqueta }}
          VERSION: ${{ steps.version.outputs.version }}
          FILE: desktop/release/${{ steps.exe.outputs.name }}
        run: |
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            # las notas salen de docs/releases/<etiqueta>.md si existe; si no, un texto para completar a mano
            NOTAS="docs/releases/$TAG.md"
            if [ -f "$NOTAS" ]; then
              gh release create "$TAG" --draft --target "$GITHUB_SHA" --title "Oficina $VERSION" --notes-file "$NOTAS" || true
            else
              gh release create "$TAG" --draft --target "$GITHUB_SHA" --title "Oficina $VERSION" \
                --notes "Borrador generado por el build automático. Completar las notas antes de publicar." || true
            fi
          elif [ -n "$MANUAL" ]; then
            # relanzada a mano sobre un borrador que ya existía: que apunte a este commit (la etiqueta se crea al publicar)
            gh release edit "$TAG" --target "$GITHUB_SHA" || true
          fi
          # latest.yml y el .blockmap: los lee electron-updater en las apps instaladas
          gh release upload "$TAG" "$FILE" "$FILE.blockmap" desktop/release/latest.yml --clobber

  android:
    name: Android (APK)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Versión
        id: version
        shell: bash
        run: |
          VERSION="$(node -p "require('./desktop/package.json').version")"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "name=Oficina-android-$VERSION.apk" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # el SDK de Android ya viene en ubuntu-latest (ANDROID_HOME)
      # la versión de la app (versionName y versionCode) sale de desktop/package.json (android/app/build.gradle.kts)
      - name: Armar el APK
        working-directory: android
        run: |
          ./gradlew assembleDebug testDebugUnitTest --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk "../${{ steps.version.outputs.name }}"

      - name: Guardar como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.version.outputs.name }}
          path: ${{ steps.version.outputs.name }}
          retention-days: 14

      - name: Adjuntar a la release
        if: github.ref_type == 'tag' || inputs.etiqueta != ''
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.etiqueta || github.ref_name }}
          MANUAL: ${{ inputs.etiqueta }}
          VERSION: ${{ steps.version.outputs.version }}
          FILE: ${{ steps.version.outputs.name }}
        run: |
          # los jobs de Mac y Windows corren en paralelo: si otro ya creó la release, solo se sube el APK
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            NOTAS="docs/releases/$TAG.md"
            if [ -f "$NOTAS" ]; then
              gh release create "$TAG" --draft --target "$GITHUB_SHA" --title "Oficina $VERSION" --notes-file "$NOTAS" || true
            else
              gh release create "$TAG" --draft --target "$GITHUB_SHA" --title "Oficina $VERSION" \
                --notes "Borrador generado por el build automático. Completar las notas antes de publicar." || true
            fi
          elif [ -n "$MANUAL" ]; then
            # relanzada a mano sobre un borrador que ya existía: que apunte a este commit (la etiqueta se crea al publicar)
            gh release edit "$TAG" --target "$GITHUB_SHA" || true
          fi
          gh release upload "$TAG" "$FILE" --clobber
