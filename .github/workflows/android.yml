# Arma el APK de la app de Android (android/) y lo deja como artefacto del run («Oficina-android»).
# Corre cuando cambia la app o el dibujo de los personajes pixel (el widget usa oficina/ui/pixel/), y a mano.
name: Android

on:
  push:
    paths:
      - "android/**"
      - "oficina/ui/pixel/personajes.js"
      - "oficina/ui/pixel/avatar.js"
      - ".github/workflows/android.yml"
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      # el SDK de Android ya viene en ubuntu-latest (ANDROID_HOME)
      - name: Armar el APK
        working-directory: android
        run: ./gradlew assembleDebug testDebugUnitTest --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: Oficina-android
          path: android/app/build/outputs/apk/debug/app-debug.apk
